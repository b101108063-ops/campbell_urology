<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ else }}讀書筆記 | {{ end }}{{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; line-height: 1.7; color: #222; }
    h1, h2, h3, h4 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
    h1 { font-size: 1.8em; } h2 { font-size: 1.5em; } h3 { font-size: 1.2em; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; }
    blockquote { border-left: 4px solid #60a5fa; margin: 1em 0; padding: 0.5em 1em; background: #f0f9ff; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 1em; border-radius: 6px; overflow-x: auto; }
    .nav { margin: 1em 0; }
    .nav a { margin-right: 1em; }
    .meta { color: #666; font-size: 0.9em; margin-bottom: 1em; }
    img { max-width: 100%; height: auto; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .highlight { background: #fffbeb; padding: 1em; border-radius: 6px; margin: 1em 0; border-left: 4px solid #f59e0b; }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="{{ .Site.BaseURL }}">首頁</a>
      <a href="{{ .Site.BaseURL }}docs/">所有章節</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p style="color:#666;font-size:0.85em;margin-top:2em;">
      {{ .Site.Title }} · {{ now.Format "2006" }} · 內容為讀書筆記整理
    </p>
  </footer>
</body>
</html>
