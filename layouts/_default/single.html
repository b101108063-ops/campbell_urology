{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    {{ if .Params.weight }}章節權重: {{ .Params.weight }}{{ end }}
    {{ if .Params.section }}分類: {{ .Params.section }}{{ end }}
  </div>
  {{ .Content }}
  <hr>
  <nav class="nav">
    {{ with .PrevInSection }}<a href="{{ .Permalink }}">&laquo; {{ .Title }}</a>{{ end }}
    {{ with .NextInSection }}<a href="{{ .Permalink }}">{{ .Title }} &raquo;</a>{{ end }}
  </nav>
</article>
{{ end }}
