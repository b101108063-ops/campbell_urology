{{ define "main" }}
<section>
  <h1>{{ .Title }}</h1>
  {{ if .Params.description }}<p style="color:#666;margin-bottom:1.5em;">{{ .Params.description }}</p>{{ end }}
  {{ .Content }}
  <div style="display:grid;gap:8px;margin-top:1em;">
    {{ range .Pages.ByWeight }}
    <a href="{{ .Permalink }}" style="display:block;padding:12px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;text-decoration:none;color:#1e293b;transition:all 0.2s;" onmouseover="this.style.borderColor='#60a5fa';this.style.background='#f0f9ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='#f8fafc'">
      <span style="font-weight:600;color:#2563eb;margin-right:8px;">CH{{ .Weight }}</span>
      <span>{{ .Title }}</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
